name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
# keep_vars 只保住环境变量，保不住 D1/KV；绑定必须写在下面
keep_vars = true

[observability]
enabled = true

# 你的控制台绑定：db → D1「email」，kv → KV「email」
# 下面 database_name / 显示名已对齐；还差两处 UUID，点开资源页复制后粘贴过来再推送

[[d1_databases]]
binding = "db"
database_name = "email"
# 打开 D1「email」详情页，复制 Database ID（一长串 UUID）
database_id = "e97e4811-a1d8-46d1-9a6a-1e5dc478902c"

[[kv_namespaces]]
binding = "kv"
# 打开 KV「email」详情页，复制 Namespace ID
id = "793ad3c749304965bd1f8d54204cfeb5"

# 如果没用 R2，保持注释；用了就把桶名填上并取消注释
#[[r2_buckets]]
#binding = "r2"
#bucket_name = "你的R2桶名"

#[[send_email]]
#name = "email"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 16 * * *"]

[vars]
#ai_model = ""
#analysis_cache = false
#orm_log = false
#domain = []
#admin = ""
#jwt_secret = ""

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
